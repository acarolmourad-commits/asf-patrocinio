name: ASF — Monitor de Respostas de Parceria

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6h
  workflow_dispatch:        # execução manual

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Verificar respostas e gerar follow-ups (via Composio)
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ vars.COMPOSIO_USER_ID }}
          AUTO_SEND: ${{ vars.AUTO_SEND }}
        run: python scripts/monitor_respostas.py

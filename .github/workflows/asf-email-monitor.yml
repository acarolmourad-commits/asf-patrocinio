name: ASF — Monitor de Respostas de Parceria

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6h
  workflow_dispatch:        # execução manual

permissions:
  contents: write   # necessário para persistir data/state.json

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Verificar respostas e gerar follow-ups (via Composio)
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ vars.COMPOSIO_USER_ID }}
          AUTO_SEND: ${{ vars.AUTO_SEND }}
        run: python scripts/monitor_respostas.py

      - name: Persistir estado (dedup) e relatório
        run: |
          git config user.name 'asf-monitor-bot'
          git config user.email 'asf.surffeminino@gmail.com'
          git add data/state.json data/relatorio.json
          git diff --cached --quiet || git commit -m 'chore: estado do monitor de parcerias [skip ci]'
          git push

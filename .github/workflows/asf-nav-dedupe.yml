name: asf-nav-dedupe (one-shot)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python - << 'PYEOF'
          import re, subprocess
          def run(*a): subprocess.run(list(a), check=True)
          h = open('index.html', encoding='utf-8').read()
          def repl(m):
              nav = m.group(0)
              if 'aria-label="breadcrumb"' in nav: return nav
              links = re.findall(r'href="[^"]*acarolmourad-commits\.github\.io', nav)
              if len(links) >= 2:
                  print('removendo nav legado com', len(links), 'links')
                  return ''
              return nav
          new = re.sub(r'<nav[\s>].*?</nav>', repl, h, flags=re.S|re.I)
          if 'asf-network.js' not in new:
              new = new.replace('</body>', '<script src="https://acarolmourad-commits.github.io/asf-app/asf-network.js" defer></script>\n</body>')
              print('asf-network.js injetado')
          if new == h:
              print('nada a fazer'); raise SystemExit(0)
          open('index.html','w',encoding='utf-8').write(new)
          run('git','add','index.html')
          run('git','-c','user.name=asf-bot','-c','user.email=asf.surffeminino@gmail.com','commit','-m','fix: remove menu inline legado duplicado (barra Rede ASF cobre interlinks)')
          run('git','push')
          print('DONE')
          PYEOF

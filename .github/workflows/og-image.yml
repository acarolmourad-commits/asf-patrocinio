name: Inject OG image meta
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/og-image.yml']
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          IMG="https://acarolmourad-commits.github.io/thumbnails/${REPO}.jpg"
          sed -i -E '/<meta[^>]*(og:image|twitter:image|twitter:card)[^>]*>/d' index.html
          sed -i "s#</head>#<meta property=\"og:image\" content=\"${IMG}\">\n<meta property=\"og:image:width\" content=\"1200\">\n<meta property=\"og:image:height\" content=\"630\">\n<meta name=\"twitter:card\" content=\"summary_large_image\">\n<meta name=\"twitter:image\" content=\"${IMG}\">\n</head>#" index.html
          grep -c "og:image" index.html
      - run: |
          git config user.name "ASF Bot"
          git config user.email "asf.surffeminino@gmail.com"
          git add index.html
          git commit -m "feat: add professional OG thumbnail meta tags [skip ci]" || echo "nothing to commit"
          git push
